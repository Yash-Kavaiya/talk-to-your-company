# Site layout: the single source of truth for plants, floors, cameras and zones.
# Floor coordinates are metres, origin at one corner, x along size_m[0], y along size_m[1].
# objects are fixed equipment (conveyor, rack, machine, pallets, office); rect is [x, y, width, depth].
# camera.video is an mp4 file (relative names are looked up in VIDEOS_DIR, default /cache/videos),
# `browser` (nothing until a browser shares into it) or `webcam:0` (a camera on this machine).
# Any camera can also be taken over from the browser with "Share webcam" or "Share recording".
# homography maps image pixels (1280x720) to floor metres; fill it with scripts/calibrate.py.
# The placeholder below just scales the whole image onto the whole floor.

# Mock perception stages its restricted-zone scenario on this floor, so the demo story is repeatable.
demo_restricted_floor: P1/F2

plants:

  - id: P1
    name: Plant 1
    floors:
      - id: F1
        size_m: [40, 25]
        camera:
          id: cam_p1f1
          video: browser   # fed from the browser (webcam or a recording); or p1f1.mp4, or webcam:0
          homography: [[0.03125, 0, 0], [0, 0.034722, 0], [0, 0, 1]]
        zones:
          - {id: z1, type: restricted, polygon: [[0, 0], [6, 0], [6, 6], [0, 6]]}
          - {id: z2, type: dock, polygon: [[30, 0], [40, 0], [40, 8], [30, 8]]}
        objects:
